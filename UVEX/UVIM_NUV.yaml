object: instrument
alias: INST
name: NUV
description: base configuration for UVIM NUV imaging plane

properties:
  pixel_scale: 1.03  # arcsec / pixel
  plate_scale: 103   # arcsec / mm
  # Location of instrument center with respect to sky origin
  fov_x0: -1800      # arcsec = -0.5 deg
  fov_y0: 0.0

effects:
  - name: nuv_surfaces
    description: surfaces list for NUV imaging, including the filter and dichroic transmission
    class: SurfaceList
    kwargs:
      filename: LIST_surfaces_NUV.tbl

  - name: illumination
    description: image-plane vignetting from interpolated FITS map
    class: FitsIllumination
    include: True
    kwargs:
      filename: data_files/NUV_vignetting_model_4096.fits
      detector_layout: data_files/CALDB/scopesim/UVIM_DET_layout.dat
      normalize: False
      interpolate: True

  - name: psf
    class: SeeingPSF
    include: False
    kwargs:
      fwhm: 2
      fwhm_unit: arcsec

# PSF effects
# oversampling: Factor by which to oversample the image for convolution; the PSF is sampled to this resolution as well.
#               This must divide into 10 (the PSF oversampling factor) and it must be <= 10, so options are 1,2,5,10

  - name: detector_psf
    description: PSF on the detector
    class: UVIMImagerPSF
    include: True
    kwargs:
      directory: "NUV_PSF"

      wavelength_dependent: true
      inband_max_um: 0.270

      wavelength_psf_libraries:
        - wavelength_um: 0.300
          directory: "NUV_Out-of-Band/300nm"

        - wavelength_um: 0.400
          directory: "NUV_Out-of-Band/400nm"

        - wavelength_um: 0.500
          directory: "NUV_Out-of-Band/500nm"

        - wavelength_um: 0.700
          directory: "NUV_Out-of-Band/700nm"

        - wavelength_um: 1.000
          directory: "NUV_Out-of-Band/1000nm"
      
# NUV-specific simulation parameters
---
object: simulation
alias: SIM
name: NUV_simulation_parameters
description: simulation parameters for UVEX NUV imaging

properties:
  spectral:
    wave_min: 0.1000
    wave_mid: 0.6000
    wave_max: 1.1000
    wave_unit: um

  computing:
    oversampling_x: 1
    oversampling_y: 1
    psf_oversampling: 10
    flux_accuracy: 1e-4
    tile_size: 32
