object: telescope
alias: TEL
name: UVEX
description: The Ultraviolet Explorer telescope common optics

properties:
  temperature: 0
  telescope: UVEX
  area: 0.4417865
  area_unit: m2

effects:
  - name: spacecraft_pointing
    description: Blurring due to spacecraft pointing jitter
    class: SpacecraftPointing
    include: True
    kwargs:
      fwhm: 2
      fwhm_unit: arcsec
      
  - name: ota_surface_list
    description: list of surfaces in UVEX OTA
    class: SurfaceList
    kwargs:
      filename: LIST_mirrors_OTA.tbl

---
alias: ATMO
description: "Fake !ATMO.location to avoid confusing ScopeSim"
properties:
  location: Space
